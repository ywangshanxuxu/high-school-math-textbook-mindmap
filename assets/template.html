<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>__TITLE__ · 数学知识导图</title><style>__KATEX_CSS__</style>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182c47;font-family:'Microsoft YaHei',sans-serif}header{padding:18px 24px;background:#122b45;color:white}h1{font-size:22px;margin:0 0 8px}header p{margin:0;font-size:13px;color:#cbdaeb}nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;background:white;border-bottom:1px solid #dce4ee}button,input,select{font:inherit;border:1px solid #ced8e5;background:white;border-radius:6px;padding:8px 12px;color:#182c47}button{cursor:pointer}button:hover{background:#eaf2ff}input{width:200px}.badge{padding:6px 12px;background:#fff3c7;color:#6b4900;font-size:13px}.release{background:#ddf5e5;color:#15542d}main{display:grid;grid-template-columns:minmax(0,1fr) 330px;height:calc(100vh - 166px);min-height:430px}#map{width:100%;height:100%;background:#fff}aside{padding:18px;overflow:auto;border-left:1px solid #dce4ee}h2{font-size:17px;margin:0 0 14px}#detail p{font-size:14px;line-height:1.7}#results{display:grid;gap:6px;margin-bottom:18px}.node-label{display:block;max-width:380px;white-space:normal;line-height:1.6;cursor:pointer}.node-label small{display:block;font-size:11px;color:#657891}.node-label.match{background:#fff0a8;border-radius:4px}.formula{display:block;padding-top:4px}.pending{color:#ab6200}.quote{white-space:pre-wrap;border-left:3px solid #b1c8e2;padding:8px;background:white;overflow-wrap:anywhere}.hint{font-size:12px;color:#657891}#error{color:#ac2929;white-space:pre-wrap}@media(max-width:800px){main{grid-template-columns:1fr;height:auto}#map{height:65vh}aside{border-top:1px solid #dce4ee}}@media print{nav,.badge{display:none}main{height:85vh}}
</style></head><body><header><h1>__TITLE__</h1><p>教材原有结构 × 高考复习知识网络 · 点击节点查看出处与关系</p></header>
<div id="status" class="badge"></div><nav aria-label="课堂导图工具">
<select id="mode" aria-label="导图模式"><option value="textbook">严格教材结构</option><option value="exam">高考复习知识网络</option></select>
<button id="expand">全部展开</button><button id="collapse">折叠到一级</button><button id="fit">适应窗口</button><button id="plus" aria-label="放大">＋</button><button id="minus" aria-label="缩小">－</button>
<input id="search" placeholder="搜索标题、公式或原文" aria-label="搜索"><button id="clear">清除搜索</button></nav>
<main><svg id="map" role="img" aria-label="可折叠数学知识导图"></svg><aside><h2>节点与页码溯源</h2><div id="results"></div><div id="detail"><p>点击节点文字查看 PDF 页码、书页和原文。点击圆点折叠/展开；滚轮缩放，拖动空白区域移动。</p><p class="hint">复习模式中的跨节点关系在此处列出。扫描件、公式语义与真实教材层级需人工核对。</p></div><div id="error"></div></aside></main>
<script id="dataset" type="application/json">__DATA__</script><script>__VENDOR_JS__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('dataset').textContent);
const nodes=Object.fromEntries(data.nodes.map(n=>[n.id,n]));
const formulas=Object.fromEntries(data.formulas.map(f=>[f.id,f]));
const pages=Object.fromEntries(data.pages.map(p=>[p.pdf_page,p]));
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status=$('status');status.textContent=data.build.release?'已签署复核版本 · 语法校验不证明数学语义正确':'待复核草稿 · 不可作为已校验教材结论';if(data.build.release)status.classList.add('release');
let mm, currentTree, query='', fold=false;
function formulaHTML(f){if(!f.latex)return '<span class="pending">公式待转录：'+esc(f.raw)+'</span>';try{return katex.renderToString(f.latex,{throwOnError:true,trust:false,strict:'error',maxExpand:1000});}catch(e){return '<span class="pending">公式语法错误：'+esc(f.latex)+'</span>';}}
function matches(n){return query&&[n.title,...n.sources.map(s=>s.quote),...n.formula_ids.map(id=>formulas[id].latex||formulas[id].raw)].join(' ').toLowerCase().includes(query);}
function convert(branch,depth=0){const n=nodes[branch.node_id];const label=n.formula_ids.length?n.title.replace(/\$\$?.*?\$\$?/g,'').trim():n.title;return {content:'<span class="node-label '+(matches(n)?'match':'')+'" data-node="'+esc(n.id)+'">'+esc(label)+n.formula_ids.map(id=>'<span class="formula">'+formulaHTML(formulas[id])+'</span>').join('')+'<small>'+(n.origin==='teacher'?'教师补充 · ':n.origin==='metadata'?'':'教材 · ')+(n.sources.map(s=>'PDF '+s.pdf_page+' / 书页 '+pages[s.pdf_page].printed_page).join('、')||(n.origin==='teacher'?'无教材页码':'元数据'))+(n.review==='approved'?'':' · 待复核')+'</small></span>',payload:{fold:fold&&depth>=1?1:0},children:branch.children.map(c=>convert(c,depth+1))};}
async function draw(){currentTree=convert(data[$('mode').value]);if(!mm)mm=markmap.Markmap.create('#map',{duration:0,maxWidth:400,zoom:true,pan:true,spacingHorizontal:70},currentTree);else await mm.setData(currentTree);await document.fonts.ready;await mm.fit();searchResults();}
function paragraph(parent,text,cls){const p=document.createElement('p');p.textContent=text;if(cls)p.className=cls;parent.appendChild(p);}
function show(id){const n=nodes[id],el=$('detail');el.replaceChildren();const h=document.createElement('h2');h.textContent=n.title;el.appendChild(h);paragraph(el,(n.origin==='teacher'?'教师补充':'教材/元数据')+' · '+(n.review==='approved'?'已复核':'待复核'));if(n.rationale)paragraph(el,n.rationale);for(const s of n.sources){paragraph(el,'PDF 第 '+s.pdf_page+' 页 · 书页 '+pages[s.pdf_page].printed_page+' · 提取文本第 '+s.line+' 行');paragraph(el,s.quote,'quote');}for(const id of n.formula_ids){const f=formulas[id],div=document.createElement('div');div.innerHTML=formulaHTML(f);el.appendChild(div);paragraph(el,'原始候选：'+f.raw+' · '+f.review+' · 复核人：'+(f.reviewer||'未签署'));if(f.note)paragraph(el,f.note);}if($('mode').value==='exam'){for(const r of data.relations.filter(r=>r.from===id||r.to===id)){const other=r.from===id?r.to:r.from;const b=document.createElement('button');b.textContent=({'prerequisite':'先修','equivalent':'等价','application':'应用','contrast':'辨析'}[r.type])+'：'+nodes[r.from].title+' → '+nodes[r.to].title;b.onclick=()=>show(other);el.appendChild(b);paragraph(el,r.rationale);}}paragraph(el,'源 PDF：'+data.book.pdf_name+'\nSHA256：'+data.book.sha256,'hint');}
function visibleIds(b,set=new Set()){set.add(b.node_id);b.children.forEach(c=>visibleIds(c,set));return set;}
function searchResults(){const el=$('results');el.replaceChildren();if(!query)return;const ids=visibleIds(data[$('mode').value]);const found=data.nodes.filter(n=>ids.has(n.id)&&matches(n));paragraph(el,'本模式匹配 '+found.length+' 个节点');for(const n of found){const b=document.createElement('button');b.textContent=n.title;b.onclick=()=>show(n.id);el.appendChild(b);}}
function guarded(fn){return async()=>{try{await fn();}catch(e){$('error').textContent=e.message;}};}
$('mode').onchange=guarded(()=>{fold=false;return draw();});$('expand').onclick=guarded(()=>{fold=false;return draw();});$('collapse').onclick=guarded(()=>{fold=true;return draw();});$('fit').onclick=guarded(()=>mm.fit());$('plus').onclick=guarded(()=>mm.rescale(1.25));$('minus').onclick=guarded(()=>mm.rescale(.8));let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(guarded(()=>{query=$('search').value.trim().toLowerCase();fold=false;return draw();}),180);};$('clear').onclick=guarded(()=>{$('search').value='';query='';return draw();});$('map').addEventListener('click',e=>{const label=e.target.closest('[data-node]');if(label)show(label.dataset.node);});window.addEventListener('resize',guarded(()=>mm.fit()));draw().catch(e=>$('error').textContent=e.message);
</script></body></html>
